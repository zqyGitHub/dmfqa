## OpenAI
# 推荐通过环境变量注入：
# export OPENAI_API_KEY=xxxx
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=gpt-4o-mini
app.ai.openai.temperature=0.2

## MCP weather server (stdio)
# 默认使用本仓库自带的 python MCP server
app.ai.mcp.weather.command=python3,mcp/weather_mcp_server.py
app.ai.mcp.log-events=false

